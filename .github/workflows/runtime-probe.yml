name: runtime-probe
on:
  push:
    branches: [fix/reliable-plugin-workflow]
permissions:
  contents: read
jobs:
  environment:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the hosted execution environment
        run: |
          rustc --version
          cargo --version
          python3 --version
          git --version
