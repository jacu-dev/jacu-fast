name: validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install the pinned compiler
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt
      - name: Test the actual runtime
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts
          cargo +1.98.1 test --locked 2>&1 | tee artifacts/cargo-test.txt
      - name: Build the distribution executable
        run: cargo +1.98.1 build --release --locked
      - name: Preserve the exact source and executable under test
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts
          git archive --format=tar HEAD > artifacts/source.tar
          if [ -f target/release/jacu ]; then cp target/release/jacu artifacts/jacu; fi
          git rev-parse HEAD > artifacts/commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: validation-${{ matrix.os }}
          path: artifacts/
          retention-days: 7
